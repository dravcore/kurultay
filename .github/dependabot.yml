version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Without this Dependabot targets the repository default branch, which is `main`.
    # Under Git Flow `main` is releases only — it takes merges from release/* and
    # hotfix/* and nothing else — so a dependency bump must never open against it.
    # `develop` is the integration branch and the correct base for routine updates.
    target-branch: develop
    # Majors now arrive as one PR per package, so the cap has to leave room for a
    # week that lands several of them alongside the two grouped PRs.
    open-pull-requests-limit: 15
    ignore:
      # TypeScript 7 is held, not skipped. Two dependencies declare ranges that exclude it:
      # `typescript-eslint` peers on `typescript >=4.8.4 <6.1.0` and `ts-jest` on `>=4.3 <7`.
      # Taking 7 today means dropping type-aware linting or the API test runner, which is not
      # something a version bump gets to decide. Remove this entry once both publish stable
      # releases that accept 7 — until then Dependabot would reopen a PR every week that
      # cannot pass CI, and a recurring red PR teaches everyone to ignore red PRs.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major

    groups:
      # Only minor/patch is grouped. A grouped PR is all-or-nothing: one member that
      # needs a real migration holds back every other member until someone does the
      # work. Minor/patch bumps rarely need migration, so batching them is a net win
      # — one PR, one CI run, one review.
      #
      # Majors are deliberately left out of every group. Dependabot opens an
      # individual PR for any update that matches no group, which is exactly what a
      # breaking change needs: reviewed, migrated and merged on its own timeline
      # without blocking anything else.
      production:
        dependency-type: production
        update-types:
          - minor
          - patch
      development:
        dependency-type: development
        update-types:
          - minor
          - patch

  # Every `uses:` in .github/workflows/ is pinned to a full commit SHA (audit finding SEC-06,
  # roadmap P3-5) with the release tag in a trailing same-line comment. That changes what this
  # block does, in three ways worth writing down rather than rediscovering:
  #
  #   1. It keeps working. Dependabot "only supports updates to Actions using the GitHub
  #      repository syntax, such as `actions/checkout@v6` or `actions/checkout@<commit>`", and
  #      it "updates the version documentation of Actions when the comment is on the same line".
  #      So the SHA and its `# vX.Y.Z` comment are both rewritten on a bump. Trailing comments
  #      in the workflows are load-bearing, not decoration — dropping one silently degrades the
  #      PR titles to bare SHAs and loses Dependabot's sense of which release is installed.
  #
  #   2. Every SHA must be a release tag's commit. "If the commit you use is not associated with
  #      any tag, Dependabot will update the Actions to the latest commit (which might differ
  #      from the latest release)" — i.e. a SHA taken from a branch head silently converts this
  #      block from release tracking to default-branch tracking.
  #
  #   3. Dependabot *alerts* stop covering these actions: it "only creates alerts for vulnerable
  #      actions that use semantic versioning and will not create alerts for actions pinned to
  #      SHA values". This is the real cost of pinning and it is accepted knowingly — the weekly
  #      version updates below are what closes the window instead, so a patched action still
  #      arrives, just on a schedule rather than on an advisory. An action with a live advisory
  #      needs a manual SHA bump; nothing will page anyone about it.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Same reason as above. This block is why PRs #74-#78 opened against `main`
    # and were merged straight into it, bypassing `develop` entirely.
    target-branch: develop
    # Raised from 5 alongside SHA pinning. Under `@v7` an upstream patch release moved the
    # major tag and produced no diff at all, so most weeks were quiet; under a SHA pin every
    # patch release of any of the fifteen actions in use is a diff. The grouping below keeps
    # the usual week to one PR, but a week where several actions cut majors needs the headroom.
    open-pull-requests-limit: 10

    groups:
      # Same reasoning as the npm groups above, and the same split: minor/patch batched into
      # one PR, majors deliberately ungrouped so each gets its own reviewed PR. Actions majors
      # are where the breaking changes live (a runner Node bump, a renamed input), and they are
      # exactly what should not be able to hide inside a one-line SHA diff.
      actions:
        update-types:
          - minor
          - patch

  # `mailpit` in `docker-compose.dev.yml` is now pinned `tag@sha256:...` instead of `:latest`
  # (roadmap Hardening: "mailpit pinned by digest"), which is what gives this ecosystem
  # something to bump. `directory: /` also covers `docker-compose.yml` in the same directory:
  # its `postgres`/`redis`/`caddy` tags may get bump PRs too, which is fine, and its
  # `ghcr.io/dravcore/kurul-*` images resolve the `${TAG:-latest}` build arg through the
  # release pipeline rather than a literal tag, so Dependabot has nothing to propose there.
  #
  # The e2e workflow's own `services: mailpit` image is a separate pin this ecosystem does not
  # see at all — Dependabot's `docker` ecosystem only reads Dockerfiles and compose files, not
  # a `uses:`-adjacent `services:` block in a workflow — so that one stays a manual bump; see
  # the comment on it in `.github/workflows/e2e.yml`.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    # Same reasoning as the other two blocks: `main` takes only release/* and hotfix/* merges.
    target-branch: develop
