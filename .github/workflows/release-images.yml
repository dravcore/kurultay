name: Release images

# audit/findings/devops.md OPS-04: a self-host product with no published artifact means every
# install *and every upgrade* rebuilds from source (measured: api 52s + web 22s, real OOM risk
# on a small VPS). This workflow is the fix — it publishes the images to GHCR so `docker
# compose pull && up -d` (docs/development.md#full-stack-in-docker) replaces
# `docker compose up --build` as the normal path. The `migrate` one-shot service was originally
# left building from source (OPS-04's own text scopes that fix to "api+web imajlarını yayınla"),
# and that scoping broke the curl-based install in docs/self-hosting.md outright — that path
# downloads no source tree, so a service that can only `build:` never starts, and `api`
# (`service_completed_successfully` on it) never comes up either. Audit finding OPS-01:
# `kurul-migrate` is therefore published here alongside the other two, from the first release
# after v0.2.0 onward.
#
# Triggered by the tag push, not by the release/* -> main PR that precedes it
# (docs/git-strategy.md#release-process step 5: `git tag -a vX.Y.Z && git push origin vX.Y.Z`)
# — a release/* branch or its PR can still be abandoned or force-fixed before that point, so
# building images any earlier would risk publishing a version nobody actually released.
#
# Every `uses:` below is pinned to a full commit SHA with the release tag in a trailing
# same-line comment — audit finding SEC-06 (issue #157), roadmap P3-5, applied as one repo-wide
# pass across all five workflow files rather than a one-off here. The comment is not decoration:
# Dependabot only rewrites the version documentation of an action "when the comment is on the
# same line", and it is what tells Dependabot which release the SHA stands for. Every SHA below
# is the head commit of a real release tag, which matters because a SHA that belongs to no tag
# makes Dependabot track the upstream default branch's latest commit instead of its latest
# release.
on:
  push:
    tags:
      # A released version, and a pre-release of one. The second pattern exists so the release
      # path can be *rehearsed*: this workflow publishes images, signs them and attaches SBOMs,
      # and until a tag matching it is pushed none of that has ever executed. Cutting a real
      # version as the first run of an unexecuted workflow makes the release the test.
      #
      # The `-*` suffix is deliberately loose — `-rc.1`, `-beta.2`, anything SemVer calls a
      # pre-release. What a pre-release must never do is claim a stable pointer, which is
      # handled where the tags are computed rather than here; see the `metadata-action` step.
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

# `contents: read` is the default-safe floor for a checkout. The two elevated grants this
# workflow needs are declared per job instead of here, because they are needed by different
# jobs and nothing is gained by handing both to both: `build-and-push` gets `packages: write`
# (push images and their cosign signatures) plus `id-token: write` (mint the OIDC token cosign
# exchanges for a Fulcio certificate), and `publish-sbom` gets `contents: write` (attach release
# assets) and neither of the other two. Everything is spent through the ephemeral,
# workflow-run-only GITHUB_TOKEN — no PAT, no repo secret, nothing that outlives this run.
permissions:
  contents: read

concurrency:
  # A release tag names one immutable version, so two runs racing to publish the same tag
  # would still converge on the same content (GHCR layers are content-addressed) — this group
  # exists to avoid burning the ~75s build twice, not to prevent a correctness problem.
  # cancel-in-progress stays false (unlike ci.yml's group): cancelling a run mid-push can leave
  # a multi-arch manifest list pointing at a platform manifest that never finished uploading,
  # which is a worse failure mode than a queued duplicate run finishing a few minutes later.
  group: release-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # -----------------------------------------------------------------------------------
  # One leg per image *and* per architecture, each on a runner of that architecture.
  #
  # This used to be one leg per image building both platforms at once, with QEMU emulating
  # arm64. It worked for `kurul-web` and it did not work for `kurul-api`: measured twice on
  # real runners, the web image finished in 13m49s and the api image was still inside
  # `docker/build-push-action` after **5h40m**, against a 6-hour job limit. The difference is
  # what the two Dockerfiles do under emulation — the api build runs `pnpm install`,
  # `prisma generate`, `nest build` and `pnpm deploy --prod`, all CPU-bound Node work, and
  # emulated CPU-bound work is roughly an order of magnitude slower. Nothing was wrong with the
  # image; the arm64 half was being *interpreted*.
  #
  # So the emulation is gone and each architecture builds natively. `ubuntu-24.04-arm` is a
  # GitHub-hosted arm64 runner, free for public repositories. `setup-qemu-action` is gone with
  # it — it exists to run foreign-architecture instructions, and there are none left.
  #
  # The cost of the split is that a leg can no longer push a tag: two legs pushing
  # `kurul-api:v0.2.0` would race, and the winner would publish a single-architecture image
  # under a tag that promises two. Each leg therefore pushes **by digest only**, and the `merge`
  # job below assembles the digests into one multi-platform index and puts the tags on that.
  # -----------------------------------------------------------------------------------
  build:
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      # Pushes the per-platform image by digest. No `id-token` here: nothing in this job signs,
      # because there is nothing worth signing yet — the artifact a user pulls is the index the
      # `merge` job creates, and that is what carries the signature.
      packages: write
    strategy:
      # No architecture ever shares a cache with the other — an arm64 scope is useless to an
      # amd64 build — so there is nothing to serialize across platforms, and a failure in any
      # one leg should not abort the rest. Within a platform, web builds an independent
      # Dockerfile and shares no cache with anything. api and migrate do share: both build
      # apps/api/Dockerfile (the `runner` target vs. its mid-file `migrate` stage), so each
      # migrate leg's `cache_from` also reads the same-platform kurul-api scope below — every
      # layer before the two targets diverge (deps install, `prisma generate`, `nest build`) is
      # one BuildKit already has from the api leg's own push, not a re-run.
      fail-fast: false
      matrix:
        include:
          - image: kurul-api
            dockerfile: apps/api/Dockerfile
            target: runner
            platform: amd64
            runner: ubuntu-latest
            cache_from: type=gha,scope=kurul-api-amd64
          - image: kurul-api
            dockerfile: apps/api/Dockerfile
            target: runner
            platform: arm64
            runner: ubuntu-24.04-arm
            cache_from: type=gha,scope=kurul-api-arm64
          - image: kurul-web
            dockerfile: apps/web/Dockerfile
            target: runner
            platform: amd64
            runner: ubuntu-latest
            cache_from: type=gha,scope=kurul-web-amd64
          - image: kurul-web
            dockerfile: apps/web/Dockerfile
            target: runner
            platform: arm64
            runner: ubuntu-24.04-arm
            cache_from: type=gha,scope=kurul-web-arm64
          # OPS-01: the one-shot migration runner, so the compose migrate service can pull
          # instead of requiring a source tree the curl-based install never downloads. Same
          # Dockerfile as kurul-api, different stage — cache_from lists the kurul-api scope of
          # the same platform second, so the shared prefix of the two stages is a cache hit
          # from whichever of the pair's two legs (api, migrate) ran first in this workflow.
          - image: kurul-migrate
            dockerfile: apps/api/Dockerfile
            target: migrate
            platform: amd64
            runner: ubuntu-latest
            cache_from: |
              type=gha,scope=kurul-migrate-amd64
              type=gha,scope=kurul-api-amd64
          - image: kurul-migrate
            dockerfile: apps/api/Dockerfile
            target: migrate
            platform: arm64
            runner: ubuntu-24.04-arm
            cache_from: |
              type=gha,scope=kurul-migrate-arm64
              type=gha,scope=kurul-api-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Only the labels are used here. Tags are applied once, by `merge`, to the index — a tag
      # written by a leg would name a half of an image.
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: build
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          # Pinned per matrix leg rather than relying on "last stage wins": both Dockerfiles
          # end on `runner`, while `kurul-migrate` is the api Dockerfile's mid-file `migrate`
          # stage — an explicit target means a future stage added after either one can't
          # silently retarget what gets published here.
          target: ${{ matrix.target }}
          platforms: linux/${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          # Push the manifest under its own digest and let `merge` name it. `name-canonical`
          # records the full registry name inside the pushed manifest so `imagetools create`
          # can resolve it by digest afterwards.
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          # BuildKit's own provenance and SBOM attestations are **off** here, and that is a
          # deliberate loss rather than an oversight. They attach as extra manifests inside a
          # per-platform push, which is exactly what `imagetools create` then has to merge —
          # and the resulting index is a shape the tooling handles inconsistently. They were
          # never the guarantee this workflow makes either: an unsigned attestation says what
          # the build claims about itself. What is promised in docs/self-hosting.md is the
          # cosign signature and the SPDX SBOM published as a release asset, and both of those
          # are produced below, after the merge, over the artifact a user actually pulls.
          provenance: false
          sbom: false
          # cache-to stays scoped to this leg's own image *and* platform: an arm64 cache is
          # useless to an amd64 build, and sharing one scope between them means each eviction
          # costs the other. cache-from reads further — `matrix.cache_from` (defined per leg
          # above) adds the same-platform kurul-api scope for the two migrate legs, since they
          # share every layer of apps/api/Dockerfile up to where the `migrate` and `runner`
          # targets diverge.
          cache-from: ${{ matrix.cache_from }}
          cache-to: type=gha,scope=${{ matrix.image }}-${{ matrix.platform }},mode=max

      # The digest is the whole output of this job. It travels as a filename rather than as
      # file content because the merge step globs the directory — see its `printf` below.
      - name: Export the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.image }}-${{ matrix.platform }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # -----------------------------------------------------------------------------------
  # One index per image, and everything that has to happen exactly once: the tags, the
  # signature, the SBOMs.
  #
  # `needs: build` without `if: !cancelled()` on purpose — unlike the SBOM publisher below,
  # there is nothing partial to salvage here. An index assembled from one architecture when two
  # were built is not a smaller success, it is a tag that lies about what it contains.
  # -----------------------------------------------------------------------------------
  merge:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Writes the tags onto the index, and the cosign signature GHCR stores beside it as a
      # second tag on the same repository (`sha256-<digest>.sig`).
      packages: write
      # Keyless signing, and the only reason this grant exists. Without it
      # `ACTIONS_ID_TOKEN_REQUEST_URL` is unset and `cosign sign` cannot get the OIDC token it
      # trades for a short-lived Fulcio certificate — it does not fall back to anything, it
      # fails.
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        image: [kurul-api, kurul-web, kurul-migrate]
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true
          path: /tmp/digests

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The tag policy lives here now, unchanged in substance: exact versions always, moving
      # pointers only for a release. `v{{version}}` is the odd one out and it is a bug fix, not
      # a preference. `{{version}}` strips the `v` — upstream's own table has git tag `v1.2.3`
      # producing `1.2.3` — while every place in this repository that tells an operator how to
      # pin a release says `TAG=vX.Y.Z`: README.md, README.tr.md, docs/self-hosting.md,
      # docs/development.md (three times), their Turkish mirrors, and the comment beside
      # `image:` in docker-compose.yml.
      #
      # `enable=` on the last two is what keeps a rehearsal from being mistaken for a release.
      # `{{major}}.{{minor}}` and `latest` are moving pointers: an operator who follows
      # docs/self-hosting.md without setting TAG gets `latest`, so publishing an `-rc` under it
      # would hand a release candidate to everyone who never asked for one. The condition is
      # written out rather than left to the action's own pre-release handling, because
      # `type=raw` has none: raw is unconditional by definition.
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern=v{{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      # `imagetools create` writes a manifest list referencing the per-platform manifests the
      # build legs pushed. Nothing is re-uploaded: the layers are already in the registry, and
      # this is the small piece of metadata that says "these two are one image".
      - name: Assemble the multi-platform index
        working-directory: /tmp/digests
        env:
          REGISTRY_IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
        run: |
          set -euo pipefail
          # One file per architecture, named after its digest. Two is the expected count, and
          # asserting it is what keeps a silently-missing leg from producing a single-arch
          # image under a two-arch tag — the exact failure `needs: build` alone would not catch
          # if a leg were ever allowed to be skipped.
          count=$(ls -1 | wc -l)
          if [ "$count" -ne 2 ]; then
            echo "Expected 2 per-platform digests, found $count:"; ls -l
            exit 1
          fi
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${REGISTRY_IMAGE}@sha256:%s " *)

      # The digest of the index just written — the thing every tag above now resolves to, and
      # the thing that gets signed. Read back from the registry rather than assumed, because
      # what is signed must be what was published.
      # Read back through a tag that was actually written, which is not the same thing as the
      # git ref. Measured on `v0.2.0-rc.3`: `metadata-action` emitted exactly one tag,
      # `0.2.0-rc.3`, and none of the other three patterns produced anything — for a
      # pre-release it keeps only the bare `{{version}}`. Reading back `${{ github.ref_name }}`
      # therefore asked the registry for `:v0.2.0-rc.3`, which nothing had published, and the
      # step failed with `not found` *after* the index had been correctly assembled.
      #
      # The first entry of the metadata output is the tag this run definitely wrote, so that is
      # what gets inspected. The tags are all pointers to one index; which of them is used to
      # look it up does not change the digest that comes back.
      - name: Read the index digest
        id: index
        env:
          REGISTRY_IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
        run: |
          set -euo pipefail
          tag=$(jq -r '.tags[0] // empty' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          if [ -z "$tag" ]; then
            echo "metadata-action produced no tags; nothing was published to inspect."
            exit 1
          fi

          # The one tag every operator instruction in this repository tells them to pin is the
          # `v`-prefixed one (`TAG=vX.Y.Z`), and #229 added `pattern=v{{version}}` precisely
          # because `{{version}}` strips the `v`. A pre-release cannot check that — the pattern
          # does not fire for one — so this asserts it on the runs that can: a real release that
          # somehow stops publishing `v<version>` fails here instead of shipping a documented
          # pull command that 404s, which is the bug #229 was fixing in the first place.
          case "$GITHUB_REF_NAME" in
            *-*) ;;
            *)
              if ! jq -e --arg t "${REGISTRY_IMAGE}:${GITHUB_REF_NAME}" \
                   '.tags | index($t)' >/dev/null <<< "$DOCKER_METADATA_OUTPUT_JSON"; then
                echo "A release must publish ${REGISTRY_IMAGE}:${GITHUB_REF_NAME} — every"
                echo "documented pull command pins that form. Tags produced:"
                jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON"
                exit 1
              fi
              ;;
          esac

          digest=$(docker buildx imagetools inspect "$tag" \
            --format '{{json .Manifest}}' | jq -r '.digest')
          case "$digest" in
            sha256:*) ;;
            *) echo "imagetools returned no digest for $tag"; exit 1 ;;
          esac
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Index digest: $digest (read back through $tag)"

      # ---------------------------------------------------------------------------------
      # SEC-06 / P3-5, part 1: sign the image.
      #
      # Keyless (Fulcio + Rekor via the runner's OIDC token), not a cosign key pair. A key pair
      # would mean a long-lived private key in repository secrets: it has to be generated,
      # stored, rotated, and revoked by hand, and anyone who ever reads that secret can sign a
      # release forever without leaving a trace. Keyless has no secret to leak — the certificate
      # is minted per run, is valid for ten minutes, and binds the signature to *this workflow
      # file at this ref* rather than to "somebody who holds the key". The identity a verifier
      # checks is therefore a URL anybody can read in this repository, which is the property
      # that makes verification meaningful for a self-hoster who has never met the maintainer.
      # ---------------------------------------------------------------------------------
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the image with cosign
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}@${{ steps.index.outputs.digest }}
        # `--yes` skips the confirmation prompt for writing to the public transparency log.
        # There is no interactive terminal here to answer it, and the entry being public is the
        # point: Rekor is what lets a verifier check the signature years later, after the
        # ten-minute certificate has long expired.
        #
        # The digest signed is the index's, so `cosign verify ghcr.io/dravcore/kurul-api:v0.2.0`
        # works for amd64 and arm64 users alike — one signature, not one per architecture.
        # `--recursive` is deliberately not used: it would sign each per-platform manifest
        # separately and produce a set of signatures nobody in docs/self-hosting.md is told to
        # check.
        run: cosign sign --yes "$IMAGE"

      # ---------------------------------------------------------------------------------
      # SEC-06 / P3-5, part 2: generate the SBOM.
      #
      # Format is SPDX 2.3 JSON. It is the ISO standard (ISO/IEC 5962:2021), it is what GitHub's
      # own dependency-graph SBOM export emits, and it is what syft's own action defaults to —
      # so an operator feeding it to grype, trivy, Dependency-Track or a corporate intake form
      # does not have to convert anything first.
      #
      # One SBOM per platform, not one per image. The two platform images do not contain the
      # same packages — apps/web alone pulls @next/swc-linux-x64-gnu on one and
      # @next/swc-linux-arm64-gnu on the other — so a single file labelled "kurul-web" would
      # be accurate for amd64 and quietly wrong for every arm64 operator, which is worse than
      # publishing nothing.
      #
      # syft is pinned transitively: the version this action installs is baked into the action
      # release, so the SHA above pins the scanner too (v0.24.0 installs syft v1.42.3), and
      # Dependabot bumping the action bumps the scanner with it.
      # ---------------------------------------------------------------------------------
      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      - name: Generate an SBOM per published platform
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}@${{ steps.index.outputs.digest }}
          IMAGE_NAME: ${{ matrix.image }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p sbom
          for platform in amd64 arm64; do
            # `registry:` reads the image straight out of GHCR instead of pulling it into a
            # local daemon — no `docker pull` of two multi-hundred-MB images for a file listing.
            # Credentials come from the docker/login-action step above via ~/.docker/config.json.
            syft scan "registry:${IMAGE}" \
              --platform "linux/${platform}" \
              -o "spdx-json=sbom/${IMAGE_NAME}-${TAG}-linux-${platform}.spdx.json"
          done
          ls -l sbom/

      # Handed to the next job rather than attached to the release from here: this job is a
      # matrix, and two legs racing to create the same GitHub Release is a real race with a
      # real loser. One job, one writer.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ matrix.image }}
          path: sbom/
          if-no-files-found: error

  # -----------------------------------------------------------------------------------
  # SEC-06 / P3-5, part 3: publish the SBOM as a release asset.
  #
  # Separate job because it is the only place that needs `contents: write`, and because the
  # matrix above must finish before there is anything to attach.
  # -----------------------------------------------------------------------------------
  publish-sbom:
    needs: merge
    # `!cancelled()` rather than the default `success()`: `merge` runs `fail-fast: false`
    # precisely so a broken `web` image still lets a working `api` image reach GHCR. Gating on
    # success would then throw away the SBOM of the image that did publish, which contradicts
    # the reason fail-fast was turned off. If neither leg produced anything the step below fails
    # loudly instead of quietly attaching nothing.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      # Creating or updating the GitHub Release for this tag, and nothing else. No
      # `packages: write` and no `id-token: write` here — this job neither pushes nor signs.
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: sbom-*
          merge-multiple: true
          path: sbom
        continue-on-error: true

      - name: Attach the SBOMs to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # This job deliberately has no `actions/checkout` — it needs six JSON files from the
          # previous job, not the source tree. But `gh` normally works out which repository it
          # is talking about from the git remote in the working directory, and there is no git
          # repository here for it to read. `GH_REPO` is what replaces that, and without it
          # every `gh release` call below fails with "not a git repository".
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(sbom/*.spdx.json)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No SBOM was produced — every image build must have failed. Nothing to attach."
            exit 1
          fi
          printf 'Attaching %d file(s) to %s:\n' "${#files[@]}" "$TAG"
          printf '  %s\n' "${files[@]}"

          # docs/git-strategy.md#release-process pushes the tag (step 5) *before* a human writes
          # the release notes (step 6), so this workflow normally arrives at a tag with no
          # release behind it. Creating a draft is the only shape that stays correct in both
          # orders: if the release does not exist yet, the maintainer finds a draft waiting with
          # the assets already on it and fills in the body; if a human got there first, this
          # only uploads files and never touches the body, the title, or the draft flag — which
          # `gh release create` would, and which would un-publish a live release.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            # `--prerelease` on an `-rc` tag: GitHub's own flag for "this is not the release
            # you want", which keeps it out of the repository's "Latest release" slot and out
            # of the API consumers that read it.
            prerelease=()
            case "$TAG" in *-*) prerelease=(--prerelease) ;; esac

            # `${arr[@]+"${arr[@]}"}` rather than `"${arr[@]}"`: this block runs under
            # `set -u`, and expanding an empty array is an unbound-variable error on bash 3.2.
            # The runner ships bash 5, where it is not — but the guard costs one line and the
            # alternative is a script that depends on the runner image's bash version without
            # saying so.
            gh release create "$TAG" "${files[@]}" \
              --draft \
              ${prerelease[@]+"${prerelease[@]}"} \
              --title "$TAG" \
              --notes 'Release notes pending — replace this with the CHANGELOG.md section for this version (docs/git-strategy.md#release-process, step 6).'
          fi
