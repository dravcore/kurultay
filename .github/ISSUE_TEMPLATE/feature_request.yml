name: Feature request
description: Propose a new feature or improvement
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        **Describe the problem, who it affects, and how you would expect it to behave.**

        That is what shapes the roadmap, and an idea with upvotes on it is the strongest signal
        this project takes. Implementations are welcome too: Kurul is issue-first, so propose
        here, wait for maintainer feedback, then open the pull request.

        See [CONTRIBUTING.md](https://github.com/dravcore/kurul/blob/develop/CONTRIBUTING.md).

  - type: checkboxes
    id: existing-issue
    attributes:
      label: Is there an existing issue for this?
      description: Search open and closed issues before filing a new one.
      options:
        - label: I searched and found no existing issue for this feature
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What problem does this solve? Who is affected?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to happen?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about, and why you didn't pick them.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Mockups, links, or anything else relevant.

  - type: markdown
    attributes:
      value: |
        Note: this is issue-first — please wait for maintainer feedback before starting
        implementation. See [CONTRIBUTING.md](https://github.com/dravcore/kurul/blob/develop/CONTRIBUTING.md).
